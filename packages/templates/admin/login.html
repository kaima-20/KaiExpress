{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title">Restaurant Login</h2>
        <p class="text-muted">Restaurant owners can sign in to review orders.</p>
        <form id="restaurant-login-form" method="post">
          <div class="mb-3">
            <label class="form-label">Restaurant Email</label>
            <input type="email" name="email" class="form-control" placeholder="restaurant@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
