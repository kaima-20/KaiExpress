{% extends "base.html" %}
{% block title %}Register - KaiExpress{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="post">
  <label>Name</label>
  <input type="text" name="name" />
  <label>Email</label>
  <input type="email" name="email" />
  <label>Password</label>
  <input type="password" name="password" />
  <button type="submit">Register</button>
</form>
{% endblock %}
